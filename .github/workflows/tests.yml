name: Tests

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

jobs:
  tests:
    name: Pest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, bcmath, gd, sqlite3, pdo_sqlite

    - name: Install OCR tools
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
        python3 -m pip install --user pillow numpy opencv-python-headless rapidfuzz pypdf

    - name: Install PHP dependencies
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build assets
      run: |
        npm ci
        npm run build

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run tests
      run: php artisan test --compact
